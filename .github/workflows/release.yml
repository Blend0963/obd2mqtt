name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.0.0) : crée le tag et la release. Vide = simple build."
        required: false
        default: ""

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Release signing is optional: without these secrets only the debug APK is built
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags for release notes

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION#v}"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Le tag $TAG existe déjà"; exit 1
            fi
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then VERSION="${TAG#v}"; else VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Read by app/build.gradle.kts for versionName
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_ID="com.frodrigues.obdmqtt"
          mv app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/${APP_ID}-${VERSION}-debug.apk"
          if [ "$HAS_SIGNING" = "true" ]; then
            mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/${APP_ID}-${VERSION}-release.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk

      - name: Generate release notes from commits
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Previous release tag (if any), excluding the one being published
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${GITHUB_SHA}" --pretty=format:"- %s" --no-merges)
          else
            NOTES=$(git log "${GITHUB_SHA}" --pretty=format:"- %s" --no-merges)
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Creates the tag on this commit when it doesn't exist yet (manual run)
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
