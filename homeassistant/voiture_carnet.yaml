# ─────────────────────────────────────────────────────────────────────────────
# Carnet de bord de la voiture — /config/packages/voiture_carnet.yaml
#
# Trajets, kilométrage, entretien, consommation et coûts, records, alertes
# (moteur, turbo, batterie, défauts), annonces vocales sur l'autoradio.
#
# Besoin : l'application OBD v1.0.10+ et, dans peugeot_407.yaml, les capteurs
# « Trajet » (sensor.peugeot_407_trajet) et « Consommation instantanée ».
#
# À adapter :
#   - notify.mobile_app_mycar   → l'autoradio (annonces vocales)
#   - notify.rappels            → vos notifications (bot Telegram ou groupe de notifications)
#   - conversation.igor         → l'assistant IA qui rédige les notifications (script voiture_notifier)
#   - les intervalles d'entretien (section « Entretien », variables en tête de chaque capteur)
# ─────────────────────────────────────────────────────────────────────────────

input_number:
  voiture_kilometrage:
    name: Voiture — kilométrage
    icon: mdi:counter
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 0.1
    mode: box
  voiture_vidange_km:
    name: Voiture — kilométrage dernière vidange
    icon: mdi:oil
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 1
    mode: box
  voiture_filtre_gasoil_km:
    name: Voiture — kilométrage dernier filtre à gasoil
    icon: mdi:filter
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 1
    mode: box
  voiture_filtre_air_km:
    name: Voiture — kilométrage dernier filtre à air
    icon: mdi:air-filter
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 1
    mode: box
  voiture_distribution_km:
    name: Voiture — kilométrage dernière distribution
    icon: mdi:cog-sync
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 1
    mode: box
  voiture_prix_gasoil:
    name: Voiture — prix du gasoil
    icon: mdi:currency-eur
    unit_of_measurement: €/L
    min: 0
    max: 4
    step: 0.001
    mode: box
  voiture_plein_litres:
    name: Voiture — litres du plein
    icon: mdi:gas-station
    unit_of_measurement: L
    min: 0
    max: 100
    step: 0.01
    mode: box
  # Calculés automatiquement, à ne pas modifier à la main
  # Somme des trajets seulement : recaler le kilométrage ne la change pas
  voiture_distance_cumulee:
    name: Voiture — distance parcourue (total des trajets)
    icon: mdi:map-marker-distance
    unit_of_measurement: km
    min: 0
    max: 9999999
    step: 0.01
    mode: box
  voiture_carburant_total:
    name: Voiture — carburant consommé (total)
    icon: mdi:gas-station
    unit_of_measurement: L
    min: 0
    max: 999999
    step: 0.01
    mode: box
  voiture_carburant_brut_depuis_plein:
    name: Voiture — carburant estimé depuis le plein (brut)
    icon: mdi:gas-station-outline
    unit_of_measurement: L
    min: 0
    max: 9999
    step: 0.01
    mode: box
  voiture_plein_km:
    name: Voiture — kilométrage au dernier plein
    icon: mdi:gas-station
    unit_of_measurement: km
    min: 0
    max: 999999
    step: 0.1
    mode: box
  voiture_conso_reelle:
    name: Voiture — consommation réelle (dernier plein)
    icon: mdi:gas-station
    unit_of_measurement: L/100km
    min: 0
    max: 30
    step: 0.01
    mode: box

input_datetime:
  voiture_vidange_date:
    name: Voiture — date dernière vidange
    has_date: true
    has_time: false
  voiture_distribution_date:
    name: Voiture — date dernière distribution
    has_date: true
    has_time: false
  voiture_controle_technique:
    name: Voiture — prochain contrôle technique
    has_date: true
    has_time: false

input_text:
  voiture_dernier_trajet_id:
    name: Voiture — dernier trajet enregistré
    max: 32
  # Facteur appris des pleins (vide = 1, pas de correction). Calculé automatiquement.
  voiture_correction_conso:
    name: Voiture — correction de la consommation
    icon: mdi:tune-variant
    max: 10

input_boolean:
  voiture_annonces:
    name: Voiture — annonces vocales
    icon: mdi:account-voice
  voiture_notif_fin_trajet:
    name: Voiture — résumé de fin de trajet
    icon: mdi:message-text

input_select:
  voiture_entretien:
    name: Voiture — entretien effectué
    icon: mdi:wrench
    options:
      - Vidange
      - Filtre à gasoil
      - Filtre à air
      - Distribution

# ─── Capteurs ────────────────────────────────────────────────────────────────
template:
  # Pour afficher ou cacher les pastilles de l'Aperçu
  - binary_sensor:
      # L'appli envoie les mesures plusieurs fois par seconde tant que l'autoradio a du réseau.
      # Sans réseau (garage, parking souterrain) rien n'arrive, même pas le « moteur coupé » :
      # 2 min sans données = voiture hors ligne, donc arrêtée. last_reported avance à chaque
      # envoi, même quand la valeur ne change pas.
      - name: Voiture en ligne
        unique_id: voiture_en_ligne
        device_class: connectivity
        state: >-
          {% set ns = namespace(recent=false) %}
          {% for e in ['sensor.peugeot_407_tension_batterie', 'sensor.peugeot_407_trajet'] %}
            {% set s = states[e] %}
            {% if s is not none and s.state not in ['unavailable', 'unknown']
                  and (now() - s.last_reported).total_seconds() < 120 %}
              {% set ns.recent = true %}
            {% endif %}
          {% endfor %}
          {{ ns.recent }}
      - name: Voiture trajet en cours
        unique_id: voiture_trajet_en_cours
        icon: mdi:map-marker-path
        state: >-
          {% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}
          {{ t is mapping and t.active and is_state('binary_sensor.voiture_en_ligne', 'on') }}
      - name: Voiture entretien à prévoir
        unique_id: voiture_entretien_a_prevoir
        icon: mdi:wrench-clock
        # Seulement ce qui est renseigné : une vidange à 0 km n'a jamais été saisie
        state: >-
          {% set v = states('sensor.voiture_vidange') | float(99999) %}
          {% set vidange_saisie = states('input_number.voiture_vidange_km') | float(0) > 0 %}
          {% set ct = states('sensor.voiture_controle_technique') %}
          {# 0 jour = date jamais saisie (Home Assistant met la date du jour par défaut) #}
          {{ (vidange_saisie and v < 1000) or (ct | is_number and ct | int != 0 and -365 < ct | int < 30) }}

  - sensor:
      # Turbo et rampe en bar (remplacent l'ancien voiture_calculs.yaml : mêmes identifiants,
      # donc mêmes entités sensor.pression_turbo et sensor.pression_rampe)
      - name: Pression turbo
        unique_id: voiture_pression_turbo
        unit_of_measurement: bar
        device_class: pressure
        state_class: measurement
        icon: mdi:turbine
        availability: "{{ has_value('sensor.peugeot_407_pression_collecteur_admission') }}"
        state: >-
          {{ ((states('sensor.peugeot_407_pression_collecteur_admission') | float(0) - 101.3) / 100) | round(2) }}
      - name: Pression rampe
        unique_id: voiture_pression_rampe
        unit_of_measurement: bar
        device_class: pressure
        state_class: measurement
        icon: mdi:needle
        availability: "{{ has_value('sensor.peugeot_407_pression_rampe_injection') }}"
        state: >-
          {{ (states('sensor.peugeot_407_pression_rampe_injection') | float(0) / 100) | round(0) }}

      - name: Voiture kilométrage
        unique_id: voiture_kilometrage
        unit_of_measurement: km
        device_class: distance
        state_class: total_increasing
        icon: mdi:counter
        state: "{{ states('input_number.voiture_kilometrage') | float(0) | round(0) }}"

      - name: Voiture distance parcourue
        unique_id: voiture_distance_parcourue
        unit_of_measurement: km
        device_class: distance
        state_class: total_increasing
        icon: mdi:map-marker-distance
        state: "{{ states('input_number.voiture_distance_cumulee') | float(0) | round(2) }}"

      - name: Voiture carburant consommé
        unique_id: voiture_carburant_consomme
        unit_of_measurement: L
        device_class: volume
        state_class: total_increasing
        icon: mdi:gas-station
        state: "{{ states('input_number.voiture_carburant_total') | float(0) | round(2) }}"

      # Consommation en direct, corrigée par les pleins
      - name: Voiture consommation instantanée
        unique_id: voiture_conso_instantanee
        unit_of_measurement: L/h
        state_class: measurement
        icon: mdi:gas-station
        availability: "{{ has_value('sensor.peugeot_407_consommation_instantanee') }}"
        state: >-
          {{ (states('sensor.peugeot_407_consommation_instantanee') | float(0)
              * states('input_text.voiture_correction_conso') | float(1)) | round(1) }}
      - name: Voiture consommation aux 100
        unique_id: voiture_conso_100
        unit_of_measurement: L/100km
        state_class: measurement
        icon: mdi:gas-station
        availability: "{{ has_value('sensor.peugeot_407_consommation_aux_100') }}"
        state: >-
          {{ (states('sensor.peugeot_407_consommation_aux_100') | float(0)
              * states('input_text.voiture_correction_conso') | float(1)) | round(1) }}

      # ── Entretien : modifiez les intervalles ici ──
      - name: Voiture vidange
        unique_id: voiture_vidange
        unit_of_measurement: km
        icon: mdi:oil
        state: >-
          {% set intervalle_km = 10000 %}
          {{ (states('input_number.voiture_vidange_km') | float(0) + intervalle_km
              - states('input_number.voiture_kilometrage') | float(0)) | round(0) }}
        attributes:
          jours_restants: >-
            {% set intervalle_jours = 365 %}
            {% set d = states('input_datetime.voiture_vidange_date') | as_datetime %}
            {{ ((d | as_local + timedelta(days=intervalle_jours) - now()).days) if d else none }}
          intervalle_km: 10000
      - name: Voiture filtre à gasoil
        unique_id: voiture_filtre_gasoil
        unit_of_measurement: km
        icon: mdi:filter
        state: >-
          {% set intervalle_km = 60000 %}
          {{ (states('input_number.voiture_filtre_gasoil_km') | float(0) + intervalle_km
              - states('input_number.voiture_kilometrage') | float(0)) | round(0) }}
        attributes:
          intervalle_km: 60000
      - name: Voiture filtre à air
        unique_id: voiture_filtre_air
        unit_of_measurement: km
        icon: mdi:air-filter
        state: >-
          {% set intervalle_km = 40000 %}
          {{ (states('input_number.voiture_filtre_air_km') | float(0) + intervalle_km
              - states('input_number.voiture_kilometrage') | float(0)) | round(0) }}
        attributes:
          intervalle_km: 40000
      # 2.0 HDi : 180 000 km ou 10 ans (à vérifier dans votre carnet d'entretien)
      - name: Voiture distribution
        unique_id: voiture_distribution
        unit_of_measurement: km
        icon: mdi:cog-sync
        state: >-
          {% set intervalle_km = 180000 %}
          {{ (states('input_number.voiture_distribution_km') | float(0) + intervalle_km
              - states('input_number.voiture_kilometrage') | float(0)) | round(0) }}
        attributes:
          jours_restants: >-
            {% set d = states('input_datetime.voiture_distribution_date') | as_datetime %}
            {{ ((d | as_local + timedelta(days=3652) - now()).days) if d else none }}
          intervalle_km: 180000
      - name: Voiture contrôle technique
        unique_id: voiture_controle_technique
        unit_of_measurement: j
        icon: mdi:clipboard-check
        state: >-
          {% set d = states('input_datetime.voiture_controle_technique') | as_datetime %}
          {{ (d | as_local - today_at()).days if d else none }}

      # Coûts
      - name: Voiture coût carburant ce mois
        unique_id: voiture_cout_mois
        unit_of_measurement: €
        icon: mdi:currency-eur
        state: >-
          {{ (states('sensor.voiture_carburant_ce_mois') | float(0)
              * states('input_number.voiture_prix_gasoil') | float(0)) | round(2) }}

  # Historique des 10 derniers trajets et records, mis à jour à chaque fin de trajet
  - triggers:
      - trigger: event
        event_type: voiture_trajet_termine
    sensor:
      - name: Voiture historique des trajets
        unique_id: voiture_historique_trajets
        icon: mdi:history
        state: "{{ [(this.attributes.get('trajets') or []) | length + 1, 10] | min }}"
        attributes:
          trajets: "{{ ((this.attributes.get('trajets') or []) + [trigger.event.data])[-10:] }}"
      - name: Voiture records
        unique_id: voiture_records
        icon: mdi:trophy
        state: "{{ now().isoformat() }}"
        attributes:
          zero_cent: >-
            {% set old = this.attributes.get('zero_cent') %}
            {% set new = trigger.event.data.t0_100 %}
            {{ ([old, new] | reject('none') | min) if (old is not none or new is not none) else none }}
          quatre_vingt_cent_vingt: >-
            {% set old = this.attributes.get('quatre_vingt_cent_vingt') %}
            {% set new = trigger.event.data.t80_120 %}
            {{ ([old, new] | reject('none') | min) if (old is not none or new is not none) else none }}
          vitesse_max: "{{ [this.attributes.get('vitesse_max') or 0, trigger.event.data.max_kmh or 0] | max }}"
          plus_long_trajet: "{{ [this.attributes.get('plus_long_trajet') or 0, trigger.event.data.distance_km or 0] | max }}"
          meilleur_score_eco: "{{ [this.attributes.get('meilleur_score_eco') or 0, trigger.event.data.eco_score or 0] | max }}"

  # Titre en cours lu dans la notification du lecteur (Deezer, Spotify…) : le capteur
  # media session de l'appli compagnon reste vide sur l'autoradio. On ne garde que
  # les notifications de lecture (MediaStyle), les autres ne l'effacent pas.
  - triggers:
      - trigger: state
        entity_id: sensor.mycar_last_notification
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none
             and 'MediaStyle' in (trigger.to_state.attributes.get('android.template') or '') }}
    sensor:
      - name: Voiture musique
        unique_id: voiture_musique
        icon: mdi:music
        state: >-
          {% set t = trigger.to_state.attributes.get('android.title') %}
          {{ (t if t not in [none, 'null', ''] else 'Inconnu') | string | truncate(250) }}
        attributes:
          artiste: >-
            {% set a = trigger.to_state.attributes.get('android.text') %}
            {{ a if a not in [none, 'null'] else '' }}
          appli: "{{ trigger.to_state.attributes.get('package', '') }}"

# Entités créées : sensor.voiture_km_cette_semaine, sensor.voiture_km_ce_mois,
# sensor.voiture_carburant_ce_mois (Home Assistant les nomme d'après « name »)
utility_meter:
  voiture_km_semaine:
    name: Voiture km cette semaine
    source: sensor.voiture_distance_parcourue
    cycle: weekly
  voiture_km_mois:
    name: Voiture km ce mois
    source: sensor.voiture_distance_parcourue
    cycle: monthly
  voiture_carburant_mois:
    name: Voiture carburant ce mois
    source: sensor.voiture_carburant_consomme
    cycle: monthly

# ─── Scripts ─────────────────────────────────────────────────────────────────
script:
  # Annonces sur les haut-parleurs de l'autoradio, dites par Igor à sa façon (son prompt,
  # sa mémoire). Le message reçu décrit l'événement ; s'il ne répond pas, il est dit tel quel.
  voiture_annonce:
    alias: Voiture — annonce vocale
    mode: queued
    max: 10
    fields:
      message:
        description: Événement à annoncer
    variables:
      agent_ia: conversation.igor
    sequence:
      - condition: state
        entity_id: input_boolean.voiture_annonces
        state: "on"
      - if:
          - condition: template
            value_template: "{{ states[agent_ia] is not none }}"
        then:
          - action: conversation.process
            continue_on_error: true
            data:
              agent_id: "{{ agent_ia }}"
              language: fr
              text: >-
                Annonce vocale automatique de ma voiture (Peugeot 407 2.0 HDi) : ta réponse
                sera lue à voix haute sur les haut-parleurs pendant que je conduis.
                Dis-moi ceci à ta façon, en une seule phrase courte, sans question, sans emoji
                ni mise en forme, sans déclencher aucune action ni notification.
                Événement : {{ message }}
            response_variable: igor
          - action: script.voiture_dire
            data:
              message: >-
                {% set r = igor.response.speech.plain.speech
                   if igor is defined and igor.response is defined
                      and igor.response.response_type != 'error' else '' %}
                {{ r if r and r | trim | length > 0 else message }}
        else:
          - action: script.voiture_dire
            data:
              message: "{{ message }}"

  # Lecture par la synthèse vocale de l'autoradio (appli compagnon « MyCar »)
  voiture_dire:
    alias: Voiture — lecture à voix haute
    mode: queued
    max: 10
    fields:
      message:
        description: Texte à lire
    sequence:
      - action: notify.mobile_app_mycar
        data:
          message: TTS
          data:
            tts_text: "{{ message }}"

  # Toutes les notifications passent par ici. Igor (agent de conversation, intégration
  # « Igor ») reformule chaque alerte avec son contexte et sa mémoire ; s'il ne répond
  # pas ou n'est pas installé, le message brut part quand même.
  voiture_notifier:
    alias: Voiture — notification
    mode: queued
    max: 20
    fields:
      titre:
        description: Titre
      message:
        description: Message
    variables:
      agent_ia: conversation.igor
    sequence:
      - if:
          - condition: template
            value_template: "{{ states[agent_ia] is not none }}"
        then:
          - action: conversation.process
            continue_on_error: true
            data:
              agent_id: "{{ agent_ia }}"
              language: fr
              text: >-
                Notification automatique de ma voiture (Peugeot 407 2.0 HDi), que je vais
                recevoir sur Telegram. Réécris-la en français en un message court (3 phrases
                maximum), en ajoutant ce que tu sais d'utile (historique, gravité, quoi faire).
                Ne pose pas de question, n'envoie aucune notification toi-même et ne déclenche
                aucune action : réponds seulement par le texte du message.
                Titre : {{ titre | default('') }}
                Message : {{ message }}
            response_variable: igor
          - action: script.voiture_envoyer
            data:
              titre: "{{ titre | default('') }}"
              message: >-
                {% set r = igor.response.speech.plain.speech
                   if igor is defined and igor.response is defined
                      and igor.response.response_type != 'error' else '' %}
                {{ r if r and r | trim | length > 0 else message }}
        else:
          - action: script.voiture_envoyer
            data:
              titre: "{{ titre | default('') }}"
              message: "{{ message }}"

  # Envoi sur notify.rappels. Le bot Telegram crée une entité (action notify.send_message) ;
  # un groupe de notifications ou l'appli mobile crée une action notify.rappels : les deux marchent.
  voiture_envoyer:
    alias: Voiture — envoi de notification
    mode: queued
    max: 20
    fields:
      titre:
        description: Titre
      message:
        description: Message
    sequence:
      - if:
          - condition: template
            value_template: "{{ states.notify.rappels is not none }}"
        then:
          - action: notify.send_message
            target:
              entity_id: notify.rappels
            data:
              title: "{{ titre | default('') }}"
              message: "{{ message }}"
        else:
          - action: notify.rappels
            data:
              title: "{{ titre | default('') }}"
              message: "{{ message }}"

  voiture_alerte:
    alias: Voiture — alerte (téléphone + autoradio)
    mode: queued
    fields:
      titre:
        description: Titre
      message:
        description: Message
      vocal:
        description: Texte dit sur l'autoradio (facultatif)
    sequence:
      - action: script.voiture_notifier
        data:
          titre: "{{ titre }}"
          message: "{{ message }}"
      - if:
          - condition: template
            value_template: "{{ vocal is defined and vocal }}"
        then:
          - action: script.voiture_annonce
            data:
              message: "{{ vocal }}"

  voiture_entretien_fait:
    alias: Voiture — entretien effectué
    icon: mdi:wrench-check
    sequence:
      - variables:
          km: "{{ states('input_number.voiture_kilometrage') | float(0) }}"
          element: "{{ states('input_select.voiture_entretien') }}"
      - choose:
          - conditions: "{{ element == 'Vidange' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.voiture_vidange_km
                data:
                  value: "{{ km }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.voiture_vidange_date
                data:
                  date: "{{ now().date() }}"
          - conditions: "{{ element == 'Filtre à gasoil' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.voiture_filtre_gasoil_km
                data:
                  value: "{{ km }}"
          - conditions: "{{ element == 'Filtre à air' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.voiture_filtre_air_km
                data:
                  value: "{{ km }}"
          - conditions: "{{ element == 'Distribution' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.voiture_distribution_km
                data:
                  value: "{{ km }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.voiture_distribution_date
                data:
                  date: "{{ now().date() }}"
      - action: persistent_notification.create
        data:
          title: Entretien enregistré
          message: "{{ element }} à {{ km | round(0) | int }} km"

  # Plein « à ras » : compare les litres réels à l'estimation et corrige la consommation
  voiture_plein_fait:
    alias: Voiture — plein effectué
    icon: mdi:gas-station
    sequence:
      - variables:
          litres: "{{ states('input_number.voiture_plein_litres') | float(0) }}"
          estime: "{{ states('input_number.voiture_carburant_brut_depuis_plein') | float(0) }}"
          km: "{{ states('input_number.voiture_kilometrage') | float(0) - states('input_number.voiture_plein_km') | float(0) }}"
          ancienne: "{{ states('input_text.voiture_correction_conso') | float(1) }}"
      - condition: template
        value_template: "{{ litres > 0 }}"
      # Correction seulement avec assez de données (sinon le plein n'était peut-être pas complet)
      - if:
          - condition: template
            value_template: "{{ estime >= 5 and km >= 100 }}"
        then:
          # Moyenne avec l'ancienne valeur pour lisser les pleins approximatifs
          - action: input_text.set_value
            target:
              entity_id: input_text.voiture_correction_conso
            data:
              value: "{{ ((ancienne + litres / estime) / 2) | round(3) if ancienne != 1 else (litres / estime) | round(3) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.voiture_conso_reelle
            data:
              value: "{{ (litres / km * 100) | round(2) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_carburant_brut_depuis_plein
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_plein_km
        data:
          value: "{{ states('input_number.voiture_kilometrage') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_plein_litres
        data:
          value: 0
      - action: persistent_notification.create
        data:
          title: Plein enregistré
          message: >-
            {{ litres }} L.
            {% if estime >= 5 and km >= 100 %}Consommation réelle : {{ (litres / km * 100) | round(1) }} L/100 km
            (estimation corrigée ×{{ (litres / estime) | round(2) }}).{% else %}Le prochain plein servira à calibrer la consommation.{% endif %}

# ─── Automatisations ─────────────────────────────────────────────────────────
automation:
  # Enregistre un trajet une seule fois : quand l'appli le déclare fini, ou quand il ne
  # bouge plus depuis 3 minutes (autoradio éteint avec le contact)
  - id: voiture_fin_de_trajet
    alias: Voiture — fin de trajet
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: template
        value_template: >-
          {% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}
          {{ t is mapping and t.id | string != states('input_text.voiture_dernier_trajet_id')
             and (not t.active or is_state('binary_sensor.voiture_en_ligne', 'off'))
             and ((t.distance_km or 0) >= 0.3 or (t.duration_min or 0) >= 2) }}
    actions:
      - variables:
          t: "{{ state_attr('sensor.peugeot_407_trajet', 'trajet') }}"
          correction: "{{ states('input_text.voiture_correction_conso') | float(1) }}"
          prix: "{{ states('input_number.voiture_prix_gasoil') | float(0) }}"
          litres: "{{ ((t.fuel_l or 0) * correction) | round(2) }}"
          trajet:
            debut: "{{ (t.start / 1000) | timestamp_local }}"
            fin: "{{ (t.end / 1000) | timestamp_local }}"
            distance_km: "{{ t.distance_km }}"
            duree_min: "{{ t.duration_min }}"
            vitesse_moy: "{{ t.avg_kmh }}"
            max_kmh: "{{ t.max_kmh }}"
            litres: "{{ litres }}"
            l100: "{{ (litres / t.distance_km * 100) | round(1) if t.distance_km >= 1 else none }}"
            cout: "{{ (litres * prix) | round(2) }}"
            eco_score: "{{ t.eco_score }}"
            accelerations: "{{ t.harsh_accel }}"
            freinages: "{{ t.harsh_brake }}"
            ralenti_min: "{{ t.idle_min }}"
            demarrage_v: "{{ t.crank_v }}"
            t0_100: "{{ t.t0_100 }}"
            t80_120: "{{ t.t80_120 }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.voiture_dernier_trajet_id
        data:
          value: "{{ t.id }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_kilometrage
        data:
          value: "{{ (states('input_number.voiture_kilometrage') | float(0) + t.distance_km) | round(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_distance_cumulee
        data:
          value: "{{ (states('input_number.voiture_distance_cumulee') | float(0) + t.distance_km) | round(2) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_carburant_total
        data:
          value: "{{ (states('input_number.voiture_carburant_total') | float(0) + litres) | round(2) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.voiture_carburant_brut_depuis_plein
        data:
          value: "{{ (states('input_number.voiture_carburant_brut_depuis_plein') | float(0) + (t.fuel_l or 0)) | round(2) }}"
      - event: voiture_trajet_termine
        event_data:
          debut: "{{ trajet.debut }}"
          fin: "{{ trajet.fin }}"
          distance_km: "{{ trajet.distance_km }}"
          duree_min: "{{ trajet.duree_min }}"
          vitesse_moy: "{{ trajet.vitesse_moy }}"
          max_kmh: "{{ trajet.max_kmh }}"
          litres: "{{ trajet.litres }}"
          l100: "{{ trajet.l100 }}"
          cout: "{{ trajet.cout }}"
          eco_score: "{{ trajet.eco_score }}"
          accelerations: "{{ trajet.accelerations }}"
          freinages: "{{ trajet.freinages }}"
          ralenti_min: "{{ trajet.ralenti_min }}"
          demarrage_v: "{{ trajet.demarrage_v }}"
          t0_100: "{{ trajet.t0_100 }}"
          t80_120: "{{ trajet.t80_120 }}"
      - if:
          - condition: state
            entity_id: input_boolean.voiture_notif_fin_trajet
            state: "on"
        then:
          - action: script.voiture_notifier
            data:
              titre: "🚗 Trajet terminé"
              message: >-
                {{ trajet.distance_km | round(1) }} km · {{ trajet.duree_min | round(0) | int }} min ·
                {{ trajet.vitesse_moy | round(0) | int }} km/h de moyenne
                {%- if trajet.l100 %} · {{ trajet.l100 }} L/100 · {{ trajet.cout }} €{% endif %}
                · éco {{ trajet.eco_score }}/100

  # Batterie au démarrage (chute de tension pendant que le démarreur tourne)
  - id: voiture_batterie_demarrage
    alias: Voiture — batterie au démarrage
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.peugeot_407_trajet
        attribute: trajet
    conditions:
      - condition: template
        value_template: >-
          {% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}
          {% set old = trigger.from_state.attributes.get('trajet') if trigger.from_state else none %}
          {{ t is mapping and t.active and t.crank_v is not none and t.crank_v < 9.8
             and (old is not mapping or old.id != t.id) }}
    actions:
      - action: script.voiture_alerte
        data:
          titre: "🔋 Batterie fatiguée"
          message: >-
            La tension est descendue à {{ state_attr('sensor.peugeot_407_trajet', 'trajet').crank_v }} V au démarrage
            (normal : plus de 10 V). Faites tester la batterie.
          vocal: La batterie a eu du mal au démarrage, la tension est tombée bas.

  - id: voiture_moteur_froid
    alias: Voiture — moteur froid sollicité
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ states('sensor.peugeot_407_regime_moteur') | float(0) > 2500
             and states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | float(100) < 60 }}
        for:
          seconds: 3
    actions:
      - action: script.voiture_annonce
        data:
          message: >-
            Moteur encore froid ({{ states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | int(0) }} °C)
            et régime élevé ({{ states('sensor.peugeot_407_regime_moteur') | int(0) }} tr/min) : il faut y aller doucement.
      - delay:
          minutes: 3

  - id: voiture_moteur_chaud
    alias: Voiture — moteur à température
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.peugeot_407_temperature_liquide_de_refroidissement
        above: 75
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state | is_number }}"
    actions:
      - action: script.voiture_annonce
        data:
          message: Le moteur vient d'atteindre sa température ({{ states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | int(0) }} °C), on peut solliciter le moteur.

  - id: voiture_surchauffe
    alias: Voiture — surchauffe moteur
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.peugeot_407_temperature_liquide_de_refroidissement
        above: 105
        for:
          seconds: 10
    actions:
      - action: script.voiture_alerte
        data:
          titre: "🌡️ Surchauffe moteur"
          message: >-
            Température moteur : {{ states('sensor.peugeot_407_temperature_liquide_de_refroidissement') }} °C.
            Arrêtez-vous dès que possible et vérifiez le liquide de refroidissement.
          vocal: Surchauffe moteur à {{ states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | int(0) }} °C, il faut s'arrêter dès que possible.

  - id: voiture_alternateur
    alias: Voiture — alternateur faible
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ states('sensor.peugeot_407_tension_batterie') | float(14) < 13.2
             and states('sensor.peugeot_407_regime_moteur') | float(0) > 1000 }}
        for:
          minutes: 1
    actions:
      - action: script.voiture_alerte
        data:
          titre: "⚡ Charge batterie faible"
          message: >-
            {{ states('sensor.peugeot_407_tension_batterie') }} V moteur tournant (normal : 13,5 à 14,8 V).
            Alternateur ou courroie à vérifier.
          vocal: Moteur tournant, la batterie ne se recharge pas correctement ({{ states('sensor.peugeot_407_tension_batterie') }} V), l'alternateur est peut-être en cause.
      - delay:
          minutes: 30

  # Pression d'admission trop basse en pleine charge : durite percée, vanne EGR, turbo…
  - id: voiture_turbo_faible
    alias: Voiture — pression turbo faible
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set rpm = states('sensor.peugeot_407_regime_moteur') | float(0) %}
          {{ states('sensor.peugeot_407_charge_moteur') | float(0) > 85 and 2000 < rpm < 3500
             and states('sensor.peugeot_407_pression_collecteur_admission') | float(999) < 160 }}
        for:
          seconds: 5
    actions:
      - action: script.voiture_alerte
        data:
          titre: "🌀 Pression turbo faible"
          message: >-
            {{ states('sensor.peugeot_407_pression_collecteur_admission') }} kPa en pleine charge
            (attendu : plus de 180). Durite de turbo, vanne EGR ou turbo à vérifier.
      - delay:
          minutes: 30

  - id: voiture_nouveau_defaut_vocal
    alias: Voiture — nouveau défaut (annonce)
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.peugeot_407_nombre_de_defauts
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.from_state.state | is_number
             and trigger.to_state.state | is_number
             and trigger.to_state.state | int > trigger.from_state.state | int }}
    actions:
      - action: script.voiture_alerte
        data:
          titre: "🔴 Nouveau défaut moteur"
          message: >-
            {% set codes = state_attr('sensor.peugeot_407_nombre_de_defauts', 'codes') or [] %}
            {% if codes %}{% for c in codes %}{{ c.code }} : {{ c.description }}{{ ' · ' if not loop.last }}{% endfor %}
            {% else %}{{ states('sensor.peugeot_407_codes_defaut') }}{% endif %}
            {{- ' · Voyant moteur allumé' if is_state('binary_sensor.peugeot_407_voyant_moteur', 'on') }}
          vocal: >-
            Nouveau défaut moteur détecté : {{ states('sensor.peugeot_407_codes_defaut') }}.

  - id: voiture_annonce_limite
    alias: Voiture — annonce de la limitation
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.vitesse_limite
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state | is_number and trigger.from_state is not none
             and trigger.to_state.state != trigger.from_state.state
             and states('sensor.peugeot_407_vitesse') | float(0) > 10 }}
    actions:
      - action: script.voiture_annonce
        data:
          message: "La limitation de vitesse passe à {{ trigger.to_state.state | int }} km/h (annonce très courte)."

  - id: voiture_rappel_entretien
    alias: Voiture — rappels d'entretien
    triggers:
      - trigger: time
        at: "09:00:00"
    actions:
      - variables:
          rappels: >-
            {% set r = namespace(l=[]) %}
            {% set v = states('sensor.voiture_vidange') | float(99999) %}
            {% set vj = state_attr('sensor.voiture_vidange', 'jours_restants') %}
            {% if states('input_number.voiture_vidange_km') | float(0) > 0 and (v < 500 or (vj is number and vj < 30)) %}{% set r.l = r.l + ['Vidange : ' ~ (v | int) ~ ' km' ~ (' / ' ~ vj ~ ' j' if vj is number else '')] %}{% endif %}
            {% for e, n, saisi in [('sensor.voiture_filtre_a_gasoil', 'Filtre à gasoil', 'input_number.voiture_filtre_gasoil_km'), ('sensor.voiture_filtre_a_air', 'Filtre à air', 'input_number.voiture_filtre_air_km'), ('sensor.voiture_distribution', 'Distribution', 'input_number.voiture_distribution_km')] %}
              {% if states(saisi) | float(0) > 0 and states(e) | float(99999) < 1000 %}{% set r.l = r.l + [n ~ ' : ' ~ (states(e) | int) ~ ' km'] %}{% endif %}
            {% endfor %}
            {% set ct = states('sensor.voiture_controle_technique') %}
            {% if ct | is_number and ct | int != 0 and -365 < ct | int < 30 %}{% set r.l = r.l + ['Contrôle technique dans ' ~ ct ~ ' jours'] %}{% endif %}
            {{ r.l }}
      - condition: template
        value_template: "{{ rappels | length > 0 }}"
      - action: script.voiture_notifier
        data:
          titre: "🔧 Entretien de la voiture"
          message: "{{ rappels | join('\n') }}"

