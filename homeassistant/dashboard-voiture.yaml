  - title: Carnet
    path: carnet
    icon: mdi:notebook
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Trajet
            icon: mdi:map-marker-path
          - type: custom:mushroom-template-card
            icon: mdi:car-arrow-right
            icon_color: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{{ 'green' if t is mapping and t.active else 'grey' }}"
            primary: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{{ ('Trajet en cours' if t.active else 'Dernier trajet') if t is mapping else 'Aucun trajet' }}"
            secondary: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% if t is mapping %}{{ t.distance_km | round(1) }} km · {{ t.duration_min | round(0) | int }} min · {{ t.avg_kmh | round(0) | int }} km/h moy. · max {{ t.max_kmh | int }}{% endif %}"
            grid_options:
              columns: 12
          - type: custom:mushroom-template-card
            icon: mdi:gas-station
            icon_color: blue
            primary: "{{ states('sensor.voiture_consommation_aux_100') if has_value('sensor.voiture_consommation_aux_100') else '—' }} L/100"
            secondary: "{{ states('sensor.voiture_consommation_instantanee') if has_value('sensor.voiture_consommation_instantanee') else '—' }} L/h en ce moment"
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            icon: mdi:leaf
            icon_color: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% set s = t.eco_score if t is mapping else 0 %}{{ 'green' if s >= 80 else ('amber' if s >= 60 else 'red') }}"
            primary: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}Éco {{ t.eco_score if t is mapping else '—' }}/100"
            secondary: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% if t is mapping %}{{ t.harsh_accel }} accél. · {{ t.harsh_brake }} freinages · {{ t.idle_min | round(0) | int }} min ralenti{% endif %}"
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}
              {% if t is mapping %}
              {% set c = states('input_text.voiture_correction_conso') | float(1) %}
              {% set prix = states('input_number.voiture_prix_gasoil') | float(0) %}
              **Carburant** : {{ (t.fuel_l * c) | round(2) }} L{% if t.l100 %} · {{ (t.l100 * c) | round(1) }} L/100{% endif %}{% if prix > 0 %} · {{ (t.fuel_l * c * prix) | round(2) }} €{% endif %}

              {% if t.crank_v %}**Batterie au démarrage** : {{ t.crank_v }} V {{ '✅' if t.crank_v >= 10 else '⚠️' }}{% endif %}{% if t.t0_100 %} · **0-100** : {{ t.t0_100 }} s{% endif %}{% if t.t80_120 %} · **80-120** : {{ t.t80_120 }} s{% endif %}
              {% else %}Aucun trajet pour l'instant : il apparaîtra au prochain démarrage du moteur.{% endif %}
      - type: grid
