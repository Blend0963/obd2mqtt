            primary: Vidange
            secondary: "{% set km = states('sensor.voiture_vidange') | float(0) %}{% set j = state_attr('sensor.voiture_vidange', 'jours_restants') %}{{ 'Dépassée de ' ~ (-km) | int ~ ' km' if km < 0 else 'Dans ' ~ km | int ~ ' km' }}{{ ' ou ' ~ j ~ ' j' if j is number }}"
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            icon: mdi:cog-sync
            icon_color: "{% set km = states('sensor.voiture_distribution') | float(0) %}{{ 'red' if km < 0 else ('orange' if km < 10000 else 'green') }}"
            primary: Distribution
            secondary: "{% set km = states('sensor.voiture_distribution') | float(0) %}{{ 'Dépassé de ' ~ (-km) | int ~ ' km' if km < 0 else 'Dans ' ~ km | int ~ ' km' }}"
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            icon: mdi:filter
            icon_color: "{% set km = states('sensor.voiture_filtre_a_gasoil') | float(0) %}{{ 'red' if km < 0 else ('orange' if km < 3000 else 'green') }}"
            primary: Filtre à gasoil
            secondary: "{% set km = states('sensor.voiture_filtre_a_gasoil') | float(0) %}{{ 'Dépassé de ' ~ (-km) | int ~ ' km' if km < 0 else 'Dans ' ~ km | int ~ ' km' }}"
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            icon: mdi:air-filter
            icon_color: "{% set km = states('sensor.voiture_filtre_a_air') | float(0) %}{{ 'red' if km < 0 else ('orange' if km < 3000 else 'green') }}"
            primary: Filtre à air
            secondary: "{% set km = states('sensor.voiture_filtre_a_air') | float(0) %}{{ 'Dépassé de ' ~ (-km) | int ~ ' km' if km < 0 else 'Dans ' ~ km | int ~ ' km' }}"
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            entity: input_datetime.voiture_controle_technique
            icon: mdi:clipboard-check
            icon_color: "{% set j = states('sensor.voiture_controle_technique') %}{{ 'grey' if not j | is_number else ('red' if j | int < 0 else ('orange' if j | int < 60 else 'green')) }}"
            primary: Contrôle technique
            secondary: "{% set j = states('sensor.voiture_controle_technique') %}{{ ('Dans ' ~ j ~ ' jours') if j | is_number else 'Date à renseigner (appuyer)' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.voiture_entretien
                name: Entretien effectué
              - type: button
                name: Enregistrer au kilométrage actuel
                icon: mdi:check
                action_name: Valider
                tap_action:
                  action: perform-action
                  perform_action: script.voiture_entretien_fait
                  confirmation:
                    text: Enregistrer cet entretien au kilométrage actuel ?
      - type: grid
        cards:
          - type: heading
            heading: Carburant et coûts
            icon: mdi:gas-station
          - type: tile
            entity: sensor.voiture_km_ce_mois
            name: Km ce mois
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.voiture_cout_carburant_ce_mois
            name: Carburant ce mois
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.voiture_km_cette_semaine
            name: Km cette semaine
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.voiture_conso_reelle
            name: Conso réelle (dernier plein)
            grid_options:
              columns: 6
          - type: entities
            title: Après un plein « à ras »
            show_header_toggle: false
            entities:
              - entity: input_number.voiture_plein_litres
                name: Litres mis
              - entity: input_number.voiture_prix_gasoil
                name: Prix du litre
              - type: button
                name: Enregistrer le plein
                icon: mdi:gas-station
                action_name: Valider
                tap_action:
                  action: perform-action
                  perform_action: script.voiture_plein_fait
          - type: markdown
            content: |
              {% set c = states('input_text.voiture_correction_conso') %}Correction de la consommation : **{{ '×' ~ c if c | is_number else 'aucune pour l’instant' }}** — elle s'affine à chaque plein enregistré.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 10 derniers trajets
            icon: mdi:history
          - type: markdown
            content: |
              {% set trajets = (state_attr('sensor.voiture_historique_des_trajets', 'trajets') or []) | reverse | list %}
              {% if trajets %}
              | Date | Km | Durée | Moy. | L/100 | € | Éco |
              |:--|--:|--:|--:|--:|--:|--:|
              {% for t in trajets -%}
              | {{ as_timestamp(t.debut) | timestamp_custom('%d/%m %H:%M') }} | {{ t.distance_km | round(1) }} | {{ t.duree_min | round(0) | int }} min | {{ t.vitesse_moy | round(0) | int }} | {{ t.l100 if t.l100 else '—' }} | {{ t.cout }} | {{ t.eco_score }} |
              {% endfor %}
              {% else %}Aucun trajet enregistré pour l'instant.{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Records
            icon: mdi:trophy
          - type: markdown
            content: |
              {% set r = states.sensor.voiture_records.attributes if states.sensor.voiture_records else {} %}
              🏁 **0-100 km/h** : {{ r.get('zero_cent') ~ ' s' if r.get('zero_cent') else '—' }}

              🚀 **80-120 km/h** : {{ r.get('quatre_vingt_cent_vingt') ~ ' s' if r.get('quatre_vingt_cent_vingt') else '—' }}

              ⚡ **Vitesse max** : {{ r.get('vitesse_max') | int if r.get('vitesse_max') else '—' }} km/h

              🛣️ **Plus long trajet** : {{ r.get('plus_long_trajet') | round(1) if r.get('plus_long_trajet') else '—' }} km

              🍃 **Meilleur score éco** : {{ r.get('meilleur_score_eco') if r.get('meilleur_score_eco') else '—' }}/100
          - type: entities
            title: Réglages
            show_header_toggle: false
            entities:
              - entity: input_boolean.voiture_annonces
                name: "Annonces vocales sur l'autoradio"
              - entity: input_boolean.voiture_notif_fin_trajet
                name: Résumé de fin de trajet sur le téléphone
