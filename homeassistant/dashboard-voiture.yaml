kiosk_mode:
  hide_sidebar: true
title: Voiture
views:
  - title: Aperçu
    path: apercu
    icon: mdi:car
    type: sections
    max_columns: 3
    badges:
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:access-point
            icon_color: "{{ 'green' if has_value('sensor.peugeot_407_tension_batterie') else 'grey' }}"
            content: "{{ 'En direct' if has_value('sensor.peugeot_407_tension_batterie') else 'Hors ligne' }}"
          - type: template
            icon: mdi:engine
            icon_color: "{{ 'green' if states('sensor.peugeot_407_regime_moteur') | float(0) > 300 else 'grey' }}"
            content: "{% set r = states('sensor.peugeot_407_regime_moteur') | float(0) %}{{ (r | int) ~ ' tr/min' if r > 300 else 'Arrêté' }}"
          - type: template
            icon: mdi:car-wrench
            icon_color: "{{ 'red' if is_state('binary_sensor.peugeot_407_voyant_moteur', 'on') or not is_state('sensor.peugeot_407_codes_defaut', 'Aucun') else 'green' }}"
            content: "{% if is_state('binary_sensor.peugeot_407_voyant_moteur', 'on') %}Voyant allumé{% elif not is_state('sensor.peugeot_407_codes_defaut', 'Aucun') %}{{ states('sensor.peugeot_407_codes_defaut') }}{% else %}Moteur OK{% endif %}"
            tap_action:
              action: navigate
              navigation_path: diagnostic
          - type: conditional
            conditions:
              - entity: sensor.peugeot_407_defauts_en_attente
                state_not: '0'
              - entity: sensor.peugeot_407_defauts_en_attente
                state_not: unavailable
            chip:
              type: template
              icon: mdi:clock-alert-outline
              icon_color: orange
              content: "{{ states('sensor.peugeot_407_defauts_en_attente') }} en attente"
              tap_action:
                action: navigate
                navigation_path: diagnostic
          - type: conditional
            conditions:
              - entity: sensor.peugeot_407_temperature_liquide_de_refroidissement
                state_not: unavailable
            chip:
              type: template
              icon: mdi:thermometer
              icon_color: "{% set t = states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | float(0) %}{{ 'blue' if t < 60 else ('green' if t < 100 else ('orange' if t < 110 else 'red')) }}"
              content: "{% set t = states('sensor.peugeot_407_temperature_liquide_de_refroidissement') | float(0) %}{{ t | int }} °C · {{ 'Moteur froid' if t < 60 else ('Moteur chaud' if t < 105 else 'Surchauffe !') }}"
          - type: conditional
            conditions:
              - entity: sensor.peugeot_407_tension_batterie
                state_not: unavailable
            chip:
              type: template
              icon: mdi:car-battery
              icon_color: "{% set v = states('sensor.peugeot_407_tension_batterie') | float(0) %}{{ 'green' if 12.4 <= v <= 14.8 else ('orange' if v >= 11.8 else 'red') }}"
              content: "{% set v = states('sensor.peugeot_407_tension_batterie') | float(0) %}{{ v }} V · {{ 'Alternateur OK' if v >= 13.3 else ('Batterie OK' if v >= 12.4 else 'Batterie faible') }}"
          - type: template
            icon: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{{ 'mdi:map-marker-path' if t is mapping and t.active else '' }}"
            icon_color: blue
            content: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% if t is mapping and t.active %}{{ t.distance_km | round(1) }} km · {{ t.duration_min | round(0) | int }} min{% endif %}"
            tap_action:
              action: navigate
              navigation_path: carnet
          - type: template
            icon: "{{ 'mdi:gas-station' if has_value('sensor.voiture_consommation_aux_100') else '' }}"
            icon_color: "{% set c = states('sensor.voiture_consommation_aux_100') | float(0) %}{{ 'green' if c < 6 else ('orange' if c < 9 else 'red') }}"
            content: "{% if has_value('sensor.voiture_consommation_aux_100') %}{{ states('sensor.voiture_consommation_aux_100') }} L/100{% endif %}"
            tap_action:
              action: navigate
              navigation_path: carnet
          - type: template
            icon: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{{ 'mdi:leaf' if t is mapping and t.active else '' }}"
            icon_color: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% set s = t.eco_score if t is mapping else 100 %}{{ 'green' if s >= 80 else ('orange' if s >= 60 else 'red') }}"
            content: "{% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}{% if t is mapping and t.active %}Éco {{ t.eco_score }}{% endif %}"
            tap_action:
              action: navigate
              navigation_path: carnet
          - type: template
            icon: "{% set v = states('sensor.voiture_vidange') | float(99999) %}{% set ct = states('sensor.voiture_controle_technique') %}{{ 'mdi:wrench-clock' if v < 1000 or (ct | is_number and ct | int < 30) else '' }}"
            icon_color: "{{ 'red' if states('sensor.voiture_vidange') | float(99999) < 0 else 'orange' }}"
            content: "{% set v = states('sensor.voiture_vidange') | float(99999) %}{% set ct = states('sensor.voiture_controle_technique') %}{% if v < 0 %}Vidange dépassée de {{ (-v) | int }} km{% elif v < 1000 %}Vidange dans {{ v | int }} km{% elif ct | is_number and ct | int < 30 %}Contrôle technique dans {{ ct }} j{% endif %}"
            tap_action:
              action: navigate
              navigation_path: carnet
        grid_options:
          columns: 12
    header:
      layout: start
      badges_position: top
      badges_wrap: wrap
    sections:
      - type: grid
        cards:
          - type: custom:clock-weather-card
            entity: weather.peugeot_407
            temperature_sensor: sensor.temperature_gps_autoradio
            forecast_rows: 3
            grid_options:
              columns: 12
          - type: custom:voiture-gps-card
            entity: device_tracker.mycar
            speed_entity: sensor.peugeot_407_vitesse
            layout: coin
            hide_attribution: true
            theme: sombre
            grid_options:
              columns: 12
              rows: 3
          - type: custom:stack-in-card
            mode: vertical
            card_mod:
              style: |
                ha-card {
                  box-shadow: none;
                }
            cards:
              - type: custom:mushroom-template-card
                icon: mdi:music
                icon_color: "{{ 'purple' if is_state('sensor.mycar_media_session', 'Playing') else 'grey' }}"
                primary: "{{ state_attr('sensor.mycar_media_session', 'media_title_deezer.android.app') or 'Rien en lecture' }}"
                secondary: "{% set artiste = state_attr('sensor.mycar_media_session', 'media_artist_deezer.android.app') %}{{ artiste ~ ' · ' if artiste else '' }}{{ 'En lecture' if is_state('sensor.mycar_media_session', 'Playing') else 'En pause' }}"
                tap_action:
                  action: url
                  url_path: app://deezer.android.app
              - type: custom:mushroom-chips-card
                alignment: center
                card_mod:
                  style: |
                    ha-card {
                      margin-top: -14px;
                      padding-bottom: 8px;
                      --chip-box-shadow: none;
                      --chip-border-width: 0;
                      --chip-background: none;
                    }
                chips:
                  - type: template
                    icon: mdi:skip-previous
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: previous
                          media_package_name: deezer.android.app
                  - type: template
                    icon: "{{ 'mdi:pause' if is_state('sensor.mycar_media_session', 'Playing') else 'mdi:play' }}"
                    icon_color: purple
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: play_pause
                          media_package_name: deezer.android.app
                  - type: template
                    icon: mdi:skip-next
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: next
                          media_package_name: deezer.android.app
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_vitesse
            name: Vitesse
            min: 0
            max: 220
            needle: true
            grid_options:
              columns: 8
              rows: 4
          - type: markdown
            content: |
              {% set l = states('sensor.vitesse_limite') %}
              # {{ l | int if l | is_number else '–' }}
            card_mod:
              style: |
                {% set l = states('sensor.vitesse_limite') %}
                {% set v = states('sensor.peugeot_407_vitesse') | float(0) %}
                {% set depasse = l | is_number and v > (l | float) + 3 %}
                ha-card {
                  aspect-ratio: 1;
                  height: auto !important;
                  width: 100%;
                  margin: auto;
                  border-radius: 50% !important;
                  border: 12px solid {{ '#9e9e9e' if not l | is_number else '#c8102e' }} !important;
                  background: white !important;
                  --primary-text-color: #1a1a1a;
                  font-family: 'Barlow Condensed', 'Roboto Condensed', sans-serif;
                  font-size: 26px;
                  font-weight: 800;
                  text-align: center;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: none !important;
                  {% if depasse %}animation: alerte 1s ease-in-out infinite;{% endif %}
                }
                @keyframes alerte {
                  50% { box-shadow: 0 0 18px 4px rgba(255,40,40,0.9) !important; transform: scale(1.05); }
                }
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_regime_moteur
            name: Régime
            min: 0
            max: 5000
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 3500
                color: "#ffc107"
              - from: 4300
                color: "#f44336"
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_temperature_liquide_de_refroidissement
            name: Moteur
            min: 0
            max: 130
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: "#2196f3"
              - from: 70
                color: "#4caf50"
              - from: 100
                color: "#ffc107"
              - from: 110
                color: "#f44336"
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_tension_batterie
            name: Batterie
            min: 10
            max: 16
            needle: true
            smooth_segments: true
            segments:
              - from: 10
                color: "#f44336"
              - from: 11.8
                color: "#ffc107"
              - from: 12.4
                color: "#4caf50"
              - from: 15
                color: "#f44336"
            grid_options:
              columns: 4
              rows: 4
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Téléphone
            icon: mdi:phone
            icon_color: green
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.autochips.bluetooth
          - type: custom:mushroom-template-card
            primary: Waze
            icon: mdi:waze
            icon_color: light-blue
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.waze
          - type: custom:mushroom-template-card
            primary: Maps
            icon: mdi:google-maps
            icon_color: red
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.google.android.apps.maps
          - type: custom:mushroom-template-card
            primary: Deezer
            icon: mdi:music
            icon_color: purple
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://deezer.android.app
          - type: custom:mushroom-template-card
            primary: Radio
            icon: mdi:radio
            icon_color: orange
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autoradio
          - type: custom:mushroom-template-card
            primary: YouTube
            icon: mdi:youtube
            icon_color: red
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.google.android.youtube
          - type: custom:mushroom-template-card
            primary: Twitch
            icon: mdi:twitch
            icon_color: deep-purple
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://tv.twitch.android.app
          - type: custom:mushroom-template-card
            primary: Chrome
            icon: mdi:google-chrome
            icon_color: amber
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.chrome
          - type: custom:mushroom-template-card
            primary: Play Store
            icon: mdi:google-play
            icon_color: teal
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.vending
          - type: custom:mushroom-template-card
            primary: DSP
            icon: mdi:equalizer
            icon_color: indigo
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autoeq
          - type: custom:mushroom-template-card
            primary: Véhicule
            icon: mdi:car-settings
            icon_color: blue-grey
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autosetting
          - type: custom:mushroom-template-card
            primary: Réglages
            icon: mdi:cog
            icon_color: grey
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.settings
  - title: Conduite
    path: conduite
    icon: mdi:speedometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Vitesse et régime
            icon: mdi:speedometer
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_vitesse
            name: Vitesse
            min: 0
            max: 220
            needle: true
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_regime_moteur
            name: Régime
            min: 0
            max: 5000
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 3500
                color: "#ffc107"
              - from: 4300
                color: "#f44336"
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_charge_moteur
            name: Charge
            min: 0
            max: 100
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: "#4caf50"
              - from: 85
                color: "#ffc107"
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.pression_turbo
            name: Turbo
            min: -0.2
            max: 1.6
            needle: true
            smooth_segments: true
            segments:
              - from: -0.2
                color: "#9e9e9e"
              - from: 0.3
                color: "#4caf50"
              - from: 1.2
                color: "#ff9800"
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_debit_air
            name: "Débit d'air"
            min: 0
            max: 150
            needle: true
            grid_options:
              columns: 4
              rows: 4
      - type: grid
        cards:
          - type: heading
            heading: En direct (15 min)
            icon: mdi:chart-bell-curve-cumulative
          - type: custom:mini-graph-card
            name: Vitesse et régime
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.peugeot_407_vitesse
                name: Vitesse
              - entity: sensor.peugeot_407_regime_moteur
                name: Régime
                y_axis: secondary
          - type: custom:mini-graph-card
            name: Charge et turbo
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.peugeot_407_charge_moteur
                name: Charge
              - entity: sensor.pression_turbo
                name: Turbo
                y_axis: secondary
          - type: custom:mini-graph-card
            name: Consommation
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: false
            entities:
              - entity: sensor.voiture_consommation_aux_100
                name: L/100
      - type: grid
        cards:
          - type: heading
            heading: Records du jour
            icon: mdi:trophy
          - type: statistic
            entity: sensor.pression_turbo
            name: Turbo max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.peugeot_407_regime_moteur
            name: Régime max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.peugeot_407_vitesse
            name: Vitesse max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.peugeot_407_vitesse
            name: Vitesse moyenne
            stat_type: mean
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
