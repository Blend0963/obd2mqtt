                color: "#4caf50"
              - from: 1400
                color: "#ff9800"
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_pression_collecteur_admission
            name: Admission
            min: 0
            max: 260
            needle: true
            grid_options:
              columns: 6
              rows: 4
          - type: custom:mini-graph-card
            name: Rampe et régime
            hours_to_show: 1
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.pression_rampe
                name: Rampe
              - entity: sensor.peugeot_407_regime_moteur
                name: Régime
                y_axis: secondary
