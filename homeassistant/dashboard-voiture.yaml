  - title: Diagnostic
    path: diagnostic
    icon: mdi:car-wrench
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Défauts moteur
            icon: mdi:engine-outline
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.peugeot_407_voyant_moteur
                name: Voyant moteur
              - entity: sensor.peugeot_407_codes_defaut
                name: Codes défaut
              - entity: sensor.peugeot_407_defauts_en_attente
                name: Défauts en attente
              - entity: sensor.peugeot_407_distance_avec_voyant_defaut
                name: Distance avec voyant allumé
          - type: custom:mushroom-template-card
            primary: Effacer les défauts
            secondary: Contact mis, moteur arrêté
            icon: mdi:broom
            icon_color: red
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.peugeot_407_effacer_les_defauts
              confirmation:
                text: Effacer les codes défaut ? Les tests antipollution seront remis à zéro et le voyant se rallumera si le défaut persiste.
      - type: grid
        cards:
          - type: heading
            heading: Codes
            icon: mdi:alert-circle-outline
          - type: markdown
            content: |
              {% set codes = state_attr('sensor.peugeot_407_nombre_de_defauts', 'codes') or [] %}
              {% set pending = state_attr('sensor.peugeot_407_defauts_en_attente', 'codes') or [] %}
              {% for c in codes %}
              - **{{ c.code }}** — {{ c.description }}
              {% endfor %}
              {% for c in pending %}
              - *{{ c.code }} (en attente)* — {{ c.description }}
              {% endfor %}
              {% if not codes and not pending %}Aucun défaut mémorisé ✅{% endif %}
              {% set clear = state_attr('sensor.peugeot_407_nombre_de_defauts', 'dernier_effacement') %}
              {% if clear is mapping %}

              _Dernier effacement : {{ clear.message }}_
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Tests antipollution
            icon: mdi:clipboard-check-outline
          - type: markdown
            content: |
              {% set tests = state_attr('sensor.peugeot_407_tests_antipollution_incomplets', 'tests') or [] %}
              {% for t in tests %}
              - {{ '✅' if t.complete else '⏳' }} {{ t.name }}
              {% endfor %}
              {% if not tests %}Pas encore lu{% endif %}
