            content: |
              {% set t = state_attr('sensor.peugeot_407_trajet', 'trajet') %}
              {% if t is mapping %}
              {% set c = states('input_text.voiture_correction_conso') | float(1) %}
              {% set prix = states('input_number.voiture_prix_gasoil') | float(0) %}
              **Carburant** : {{ (t.fuel_l * c) | round(2) }} L{% if t.l100 %} · {{ (t.l100 * c) | round(1) }} L/100{% endif %}{% if prix > 0 %} · {{ (t.fuel_l * c * prix) | round(2) }} €{% endif %}
              {% if t.crank_v %}

              **Batterie au démarrage** : {{ t.crank_v }} V {{ '✅' if t.crank_v >= 10 else '⚠️' }}{% endif %}{% if t.t0_100 %} · **0-100** : {{ t.t0_100 }} s{% endif %}{% if t.t80_120 %} · **80-120** : {{ t.t80_120 }} s{% endif %}
