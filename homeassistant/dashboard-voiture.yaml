            secondary: '{% set t = state_attr(''sensor.peugeot_407_trajet'', ''trajet'') %}{% if t is mapping %}{{ t.distance_km | round(1) }} km · {{ (t.engine_min if t.engine_min is defined else t.duration_min) | round(0) | int }} min · {{ ((t.distance_km / t.driving_min * 60) if (t.driving_min or 0) > 0 else t.avg_kmh) | round(0) | int }} km/h moy. · max {{ t.max_kmh | int }}{% endif %}'
