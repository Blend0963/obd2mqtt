            grid_options:
              columns: 12
              rows: 6
      - type: grid
        cards:
          - type: heading
            heading: Mesures
            icon: mdi:chart-box-outline
          - type: statistic
            entity: sensor.peugeot_407_tension_batterie
            name: "Min aujourd'hui"
