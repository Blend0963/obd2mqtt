kiosk_mode:
  hide_sidebar: true
title: Voiture
views:
  - title: Aperçu
    path: apercu
    icon: mdi:car
    type: sections
    max_columns: 3
    badges:
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_reprise_proposee
                state: 'on'
            chip:
              type: template
              icon: mdi:play-circle
              icon_color: white
              content: Reprendre le trajet de {{ state_attr('binary_sensor.voiture_reprise_proposee', 'precedent_debut') }} · {{ state_attr('binary_sensor.voiture_reprise_proposee', 'precedent_km') }} km
              tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.voiture_reprendre_le_trajet
        card_mod:
          style: |
            ha-card {
              --chip-height: 60px;
              --chip-font-size: 22px;
              --chip-font-weight: 700;
              --chip-icon-size: 34px;
              --chip-padding: 0 22px;
              --chip-border-radius: 30px;
              --chip-background: #2e7d32;
              --primary-text-color: #ffffff;
            }
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_moteur_tournant
                state_not: 'on'
            chip:
              type: template
              icon: '{{ ''mdi:engine-off'' if is_state(''binary_sensor.voiture_en_ligne'', ''on'') else ''mdi:access-point-off'' }}'
              icon_color: grey
              content: '{{ ''Arrêté'' if is_state(''binary_sensor.voiture_en_ligne'', ''on'') else ''Hors ligne'' }}'
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_moteur_tournant
                state: 'on'
            chip:
              type: template
              icon: mdi:car-shift-pattern
              icon_color: blue
              content: '{% set g = states(''sensor.voiture_rapport_engage'') %}{{ ''Point mort'' if g == ''N'' else (g ~ (''re'' if g == ''1'' else ''e'')) if g in [''1'',''2'',''3'',''4'',''5'',''6''] else ''—'' }}'
          - type: template
            icon: mdi:car-wrench
            icon_color: '{{ ''grey'' if not has_value(''sensor.peugeot_407_codes_defaut'') else (''red'' if is_state(''binary_sensor.peugeot_407_voyant_moteur'', ''on'') or not is_state(''sensor.peugeot_407_codes_defaut'', ''Aucun'') else ''green'') }}'
            content: '{% if not has_value(''sensor.peugeot_407_codes_defaut'') %}Défauts{% else %}{% set p = states(''sensor.peugeot_407_defauts_en_attente'') | int(0) %}{% if is_state(''binary_sensor.peugeot_407_voyant_moteur'', ''on'') %}Voyant allumé{% elif not is_state(''sensor.peugeot_407_codes_defaut'', ''Aucun'') %}{{ states(''sensor.peugeot_407_codes_defaut'') }}{% else %}Moteur OK{% endif %}{{ '' · '' ~ p ~ '' en attente'' if p > 0 else '''' }}{% endif %}'
            tap_action:
              action: navigate
              navigation_path: diagnostic
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_trajet_en_cours
                state: 'on'
            chip:
              type: template
              icon: mdi:map-marker-path
              icon_color: blue
              content: '{% set t = state_attr(''sensor.peugeot_407_trajet'', ''trajet'') %}{{ t.distance_km | round(1) }} km'
              tap_action:
                action: navigate
                navigation_path: carnet
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_trajet_en_cours
                state: 'on'
              - entity: sensor.voiture_consommation_aux_100
                state_not: unavailable
              - entity: sensor.voiture_consommation_aux_100
                state_not: unknown
            chip:
              type: template
              icon: mdi:gas-station
              icon_color: '{% set c = states(''sensor.voiture_consommation_aux_100'') | float(0) %}{{ ''green'' if c < 6 else (''orange'' if c < 9 else ''red'') }}'
              content: '{{ states(''sensor.voiture_consommation_aux_100'') }} L/100'
              tap_action:
                action: navigate
                navigation_path: carnet
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_trajet_en_cours
                state: 'on'
            chip:
              type: template
              icon: mdi:leaf
              icon_color: '{% set t = state_attr(''sensor.peugeot_407_trajet'', ''trajet'') %}{% set s = t.eco_score if t is mapping else 100 %}{{ ''green'' if s >= 80 else (''orange'' if s >= 60 else ''red'') }}'
              content: '{% set t = state_attr(''sensor.peugeot_407_trajet'', ''trajet'') %}Éco {{ t.eco_score if t is mapping else ''—'' }}'
              tap_action:
                action: navigate
                navigation_path: carnet
          - type: conditional
            conditions:
              - entity: binary_sensor.voiture_entretien_a_prevoir
                state: 'on'
            chip:
              type: template
              icon: mdi:wrench-clock
              icon_color: '{{ ''red'' if states(''sensor.voiture_vidange'') | float(99999) < 0 else ''orange'' }}'
              content: '{% set v = states(''sensor.voiture_vidange'') | float(99999) %}{% set saisie = states(''input_number.voiture_vidange_km'') | float(0) > 0 %}{% set ct = states(''sensor.voiture_controle_technique'') | int(9999) %}{% if saisie and v < 0 %}Vidange dépassée{% elif saisie and v < 1000 %}Vidange : {{ v | int }} km{% elif ct < 0 %}Contrôle technique dépassé{% else %}Contrôle technique : {{ ct }} j{% endif %}'
              tap_action:
                action: navigate
                navigation_path: carnet
        card_mod:
          style: |
            ha-card {
              --chip-height: 44px;
              --chip-font-size: 16px;
              --chip-font-weight: 600;
              --chip-icon-size: 24px;
              --chip-padding: 0 14px;
              --chip-border-radius: 22px;
              --chip-spacing: 8px;
            }
    header:
      layout: start
      badges_position: top
      badges_wrap: wrap
    sections:
      - type: grid
        cards:
          - type: custom:clock-weather-card
            entity: weather.localisation_peugeot
            temperature_sensor: sensor.temperature_gps_autoradio
            animated_icon: false
            hide_forecast_section: true
            grid_options:
              columns: 12
          - type: custom:stack-in-card
            mode: vertical
            card_mod:
              style: |
                ha-card {
                  box-shadow: none;
                  border: none;
                }
            cards:
              - type: custom:mushroom-template-card
                icon: mdi:music
                icon_color: purple
                primary: '{% set s = states.sensor.mycar_media_session %}{% set m = namespace(titre='''', artiste='''') %}{% for k, v in (s.attributes.items() if s else []) %}{% if k.startswith(''media_title'') and v and not m.titre %}{% set m.titre = v %}{% endif %}{% if k.startswith(''media_artist'') and v and not m.artiste %}{% set m.artiste = v %}{% endif %}{% endfor %}{% set n = states.sensor.voiture_musique %}{% if not m.titre and n and n.state not in [''unknown'', ''unavailable'', ''Inconnu''] %}{% set m.titre = n.state %}{% set m.artiste = n.attributes.get(''artiste'', '''') %}{% endif %}{{ m.titre or ''En lecture'' }}'
                secondary: '{% set s = states.sensor.mycar_media_session %}{% set m = namespace(titre='''', artiste='''') %}{% for k, v in (s.attributes.items() if s else []) %}{% if k.startswith(''media_title'') and v and not m.titre %}{% set m.titre = v %}{% endif %}{% if k.startswith(''media_artist'') and v and not m.artiste %}{% set m.artiste = v %}{% endif %}{% endfor %}{% set n = states.sensor.voiture_musique %}{% if not m.titre and n and n.state not in [''unknown'', ''unavailable'', ''Inconnu''] %}{% set m.titre = n.state %}{% set m.artiste = n.attributes.get(''artiste'', '''') %}{% endif %}{{ m.artiste or ''Deezer'' }}'
                tap_action:
                  action: url
                  url_path: app://deezer.android.app
                card_mod:
                  style: |
                    ha-card {
                      background: none;
                      box-shadow: none;
                      border: none;
                      --ha-card-box-shadow: none;
                      --ha-card-background: transparent;
                    }
              - type: custom:mushroom-chips-card
                alignment: center
                card_mod:
                  style: |
                    ha-card {
                      margin-top: -14px;
                      padding-bottom: 8px;
                      background: none;
                      box-shadow: none;
                      border: none;
                      --ha-card-box-shadow: none;
                      --ha-card-background: transparent;
                      --chip-box-shadow: none;
                      --chip-border-width: 0;
                      --chip-background: none;
                    }
                chips:
                  - type: template
                    icon: mdi:skip-previous
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: previous
                          media_package_name: deezer.android.app
                  - type: template
                    icon: '{{ ''mdi:pause'' if is_state(''sensor.mycar_media_session'', ''Playing'') else ''mdi:play'' }}'
                    icon_color: purple
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: play_pause
                          media_package_name: deezer.android.app
                  - type: template
                    icon: mdi:skip-next
                    tap_action:
                      action: perform-action
                      perform_action: notify.mobile_app_mycar
                      data:
                        message: command_media
                        data:
                          media_command: next
                          media_package_name: deezer.android.app
            grid_options:
              columns: 12
          - type: custom:voiture-gps-card
            entity: device_tracker.peugeot_407
            speed_entity: sensor.peugeot_407_vitesse
            speed_limit_entity: sensor.vitesse_limite
            show_speed: false
            layout: coin
            hide_attribution: true
            theme: sombre
            grid_options:
              columns: 12
              rows: 3
      - type: grid
        cards:
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_vitesse
            name: Vitesse
            min: 0
            max: 220
            needle: true
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_regime_moteur
            name: Régime
            min: 0
            max: 5000
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#4caf50'
              - from: 3500
                color: '#ffc107'
              - from: 4300
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_temperature_liquide_de_refroidissement
            name: Moteur
            min: 0
            max: 130
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#2196f3'
              - from: 70
                color: '#4caf50'
              - from: 100
                color: '#ffc107'
              - from: 110
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_tension_batterie
            name: Batterie
            min: 10
            max: 16
            needle: true
            smooth_segments: true
            segments:
              - from: 10
                color: '#f44336'
              - from: 11.8
                color: '#ffc107'
              - from: 12.4
                color: '#4caf50'
              - from: 15
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Parler à Igor
            secondary: Appuyer, puis parler
            icon: mdi:microphone
            icon_color: deep-purple
            tap_action:
              action: assist
              pipeline_id: preferred
              start_listening: true
            hold_action:
              action: assist
              pipeline_id: preferred
              start_listening: true
            grid_options:
              columns: 12
              rows: 2
            card_mod:
              style: |
                ha-card {
                  --mush-icon-size: 64px;
                  --mush-card-primary-font-size: 24px;
                  --mush-card-secondary-font-size: 16px;
                  justify-content: center;
                }
          - type: custom:mushroom-template-card
            primary: Téléphone
            icon: mdi:phone
            icon_color: green
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.autochips.bluetooth
          - type: custom:mushroom-template-card
            primary: Waze
            icon: mdi:waze
            icon_color: light-blue
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.waze
          - type: custom:mushroom-template-card
            primary: Maps
            icon: mdi:google-maps
            icon_color: red
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.google.android.apps.maps
          - type: custom:mushroom-template-card
            primary: Deezer
            icon: mdi:music
            icon_color: purple
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://deezer.android.app
          - type: custom:mushroom-template-card
            primary: Radio
            icon: mdi:radio
            icon_color: orange
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autoradio
          - type: custom:mushroom-template-card
            primary: YouTube
            icon: mdi:youtube
            icon_color: red
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.google.android.youtube
          - type: custom:mushroom-template-card
            primary: Twitch
            icon: mdi:twitch
            icon_color: deep-purple
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://tv.twitch.android.app
          - type: custom:mushroom-template-card
            primary: Chrome
            icon: mdi:google-chrome
            icon_color: amber
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.chrome
          - type: custom:mushroom-template-card
            primary: Play Store
            icon: mdi:google-play
            icon_color: teal
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.vending
          - type: custom:mushroom-template-card
            primary: DSP
            icon: mdi:equalizer
            icon_color: indigo
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autoeq
          - type: custom:mushroom-template-card
            primary: Véhicule
            icon: mdi:car-settings
            icon_color: blue-grey
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.hcn.autosetting
          - type: custom:mushroom-template-card
            primary: Réglages
            icon: mdi:cog
            icon_color: grey
            vertical: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: url
              url_path: app://com.android.settings
  - title: Conduite
    path: conduite
    icon: mdi:speedometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Vitesse et régime
            icon: mdi:speedometer
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_vitesse
            name: Vitesse
            min: 0
            max: 220
            needle: true
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_regime_moteur
            name: Régime
            min: 0
            max: 5000
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#4caf50'
              - from: 3500
                color: '#ffc107'
              - from: 4300
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_charge_moteur
            name: Charge
            min: 0
            max: 100
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#4caf50'
              - from: 85
                color: '#ffc107'
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.pression_turbo
            name: Turbo
            min: -0.2
            max: 1.6
            needle: true
            smooth_segments: true
            segments:
              - from: -0.2
                color: '#9e9e9e'
              - from: 0.3
                color: '#4caf50'
              - from: 1.2
                color: '#ff9800'
            grid_options:
              columns: 4
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_debit_air
            name: Débit d'air
            min: 0
            max: 150
            needle: true
            grid_options:
              columns: 4
              rows: 4
      - type: grid
        cards:
          - type: heading
            heading: En direct (15 min)
            icon: mdi:chart-bell-curve-cumulative
          - type: custom:mini-graph-card
            name: Vitesse et régime
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.peugeot_407_vitesse
                name: Vitesse
              - entity: sensor.peugeot_407_regime_moteur
                name: Régime
                y_axis: secondary
          - type: custom:mini-graph-card
            name: Charge et turbo
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.peugeot_407_charge_moteur
                name: Charge
              - entity: sensor.pression_turbo
                name: Turbo
                y_axis: secondary
          - type: custom:mini-graph-card
            name: Consommation
            hours_to_show: 0.25
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.voiture_consommation_aux_100
                name: L/100 km
              - entity: sensor.voiture_consommation_instantanee
                name: L/h
                y_axis: secondary
                show_fill: false
      - type: grid
        cards:
          - type: heading
            heading: Records du jour
            icon: mdi:trophy
          - type: statistic
            entity: sensor.pression_turbo
            name: Turbo max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.peugeot_407_regime_moteur
            name: Régime max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.peugeot_407_vitesse
            name: Vitesse max
            stat_type: max
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.voiture_vitesse_en_roulant
            name: Vitesse moyenne (en roulant)
            stat_type: mean
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.voiture_regime_moteur_tournant
            name: Régime moyen (moteur tournant)
            stat_type: mean
            period:
              calendar:
                period: day
            grid_options:
              columns: 12
              rows: 2
  - title: Moteur
    path: moteur
    icon: mdi:engine
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Températures
            icon: mdi:thermometer
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_temperature_liquide_de_refroidissement
            name: Moteur
            min: 0
            max: 130
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#2196f3'
              - from: 70
                color: '#4caf50'
              - from: 100
                color: '#ffc107'
              - from: 110
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_temperature_air_admission
            name: Air admission
            min: -20
            max: 80
            needle: true
            smooth_segments: true
            segments:
              - from: -20
                color: '#2196f3'
              - from: 0
                color: '#4caf50'
              - from: 50
                color: '#ffc107'
              - from: 65
                color: '#f44336'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:mini-graph-card
            name: Températures
            hours_to_show: 1
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.peugeot_407_temperature_liquide_de_refroidissement
                name: Moteur
              - entity: sensor.peugeot_407_temperature_air_admission
                name: Air
                y_axis: secondary
      - type: grid
        cards:
          - type: heading
            heading: Suralimentation
            icon: mdi:turbine
          - type: custom:modern-circular-gauge
            entity: sensor.pression_turbo
            name: Turbo
            min: -0.2
            max: 1.6
            needle: true
            smooth_segments: true
            segments:
              - from: -0.2
                color: '#9e9e9e'
              - from: 0.3
                color: '#4caf50'
              - from: 1.2
                color: '#ff9800'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
            entity: sensor.peugeot_407_debit_air
            name: Débit d'air
            min: 0
            max: 150
            needle: true
            grid_options:
              columns: 6
              rows: 4
          - type: custom:mini-graph-card
            name: Turbo et débit d'air
            hours_to_show: 1
            points_per_hour: 120
            height: 100
            line_width: 2
            smoothing: true
            show:
              fill: fade
              legend: true
            entities:
              - entity: sensor.pression_turbo
                name: Turbo
              - entity: sensor.peugeot_407_debit_air
                name: Débit
                y_axis: secondary
      - type: grid
        cards:
          - type: heading
            heading: Injection
            icon: mdi:needle
          - type: custom:modern-circular-gauge
            entity: sensor.pression_rampe
            name: Rampe
            min: 0
            max: 1800
            needle: true
            smooth_segments: true
            segments:
              - from: 0
                color: '#2196f3'
              - from: 200
                color: '#4caf50'
              - from: 1400
                color: '#ff9800'
            grid_options:
              columns: 6
              rows: 4
          - type: custom:modern-circular-gauge
